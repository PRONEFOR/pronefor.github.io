function vista(v){$('#form').hidden=v!=='f';$('#bar').hidden=v!=='f';$('#list').hidden=v!=='l';$('#nf').className=v==='f'?'on':'';$('#nl').className=v==='l'?'on':'';if(v==='l')lista();scrollTo(0,0)}
function limpiar(){document.querySelectorAll('[data-f]').forEach(e=>{if(e.hidden||e.closest('details').hidden)delete cur.data[e.dataset.f]})}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.65))};i.src=URL.createObjectURL(f)});
$('#form').addEventListener('input',e=>{const el=e.target;
 if(el.dataset.r!==undefined){cur.data.T2A[el.dataset.r][el.dataset.c]=el.value;return save()}
 const k=el.name;if(!k)return;cur.data[k]=el.type==='checkbox'?[...document.querySelectorAll(`[name="${k}"]:checked`)].map(x=>x.value):el.value;vis();save()});
$('#form').addEventListener('change',async e=>{const el=e.target;if(!el.dataset.foto||!el.files[0])return;const u=await shrink(el.files[0]);cur.data[el.dataset.foto]=u;const im=el.nextElementSibling;im.src=u;im.hidden=false;save()});
$('#form').addEventListener('click',e=>{const b=e.target,d=b.dataset;
 if(d.gps)return navigator.geolocation.getCurrentPosition(p=>{const v=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)} (±${Math.round(p.coords.accuracy)} m)`;cur.data[d.gps]=v;document.querySelector(`[name="${d.gps}"]`).value=v;save()},()=>toast('No se pudo obtener la ubicación. Activá el GPS o escribila a mano.'),{enableHighAccuracy:true,timeout:20000});
 if('addrow'in d||d.delrow!==undefined){if('addrow'in d)cur.data.T2A.push({});else if(cur.data.T2A.length>1)cur.data.T2A.splice(d.delrow,1);b.closest('[data-tabla]').innerHTML=tabla(cur.data.T2A);save()}});
async function lista(){const rs=(await all()).sort((a,b)=>b.actualizado-a.actualizado),np=rs.filter(r=>r.estado==='pendiente').length;
 $('#list').innerHTML=`<button class="b g" data-a=sync ${np?'':'disabled'}>Sincronizar pendientes (${np})</button>`+(rs.length?rs.map(r=>`<div class=card><b>${esc(r.data['1A']||'Sin código de plan')}</b> <span class=tag>${r.estado}</span><br><small>${esc(r.data['1E']||'')} · ${esc(r.data['1La']||'')}</small><div class=row>${r.estado!=='enviado'?`<button class=b data-a=edit data-id=${r.id}>Editar</button>`:''}<button class="b g" data-a=json data-id=${r.id}>Descargar copia</button><button class="b x" data-a=del data-id=${r.id}>Eliminar</button></div></div>`).join(''):'<p>Todavía no hay monitoreos guardados en este teléfono.</p>')}
$('#list').addEventListener('click',async e=>{const d=e.target.dataset;if(!d.a)return;
 if(d.a==='sync')return sync();
 const r=(await all()).find(x=>x.id===d.id);
 if(d.a==='edit'){cur=r;draw(0);vista('f')}
 if(d.a==='del'&&confirm('¿Eliminar este monitoreo del teléfono? No se puede deshacer.')){await del(d.id);lista()}
 if(d.a==='json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,1)],{type:'application/json'}));a.download=`monitoreo_${r.data['1A']||r.id}.json`;a.click()}});
async function sync(){if(!CFG.URL)return toast('Falta configurar la URL de Apps Script en CFG.URL');if(!navigator.onLine)return toast('Sin conexión: se enviará cuando haya señal');
 let n=0,er=0;for(const r of(await all()).filter(x=>x.estado==='pendiente')){const data={...r.data},fotos=[];
  for(const k in data)if(String(data[k]).startsWith('data:image')){fotos.push({campo:k,mime:'image/jpeg',b64:data[k].split(',')[1]});delete data[k]}
  try{const j=await(await fetch(CFG.URL,{method:'POST',body:JSON.stringify({clave:CFG.CLAVE,accion:'monitoreo_app',id:r.id,datos:data,fotos})})).json();if(j.ok){r.estado='enviado';await put(r);n++}else er++}catch{er++}}
 toast(`Enviados: ${n}${er?` · con error: ${er} (quedan pendientes)`:''}`);if(!$('#list').hidden)lista()}
$('#bd').onclick=()=>{limpiar();cur.actualizado=Date.now();put(cur);toast('Borrador guardado en el teléfono')};
$('#bf').onclick=async()=>{limpiar();if(!cur.data['1A']||!cur.data['1E'])return toast('Completá el código del plan (1.A) y la fecha (1.E)');cur.estado='pendiente';cur.actualizado=Date.now();await put(cur);toast('Guardado. Se enviará al haber conexión.');vista('l');if(navigator.onLine&&CFG.URL)sync()};
$('#bn').onclick=()=>confirm('¿Empezar un monitoreo nuevo? El actual queda guardado como borrador.')&&(put(cur),nuevo());
$('#nf').onclick=()=>vista('f');$('#nl').onclick=()=>{limpiar();put(cur);vista('l')};
const net=()=>{$('#net').textContent=navigator.onLine?'En línea':'Sin conexión'};addEventListener('online',()=>{net();sync()});addEventListener('offline',net);net();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{const b=(await all()).filter(r=>r.estado==='borrador').sort((a,b)=>b.actualizado-a.actualizado)[0];if(b){cur=b;draw(0)}else nuevo()})();
</script></body></html>
